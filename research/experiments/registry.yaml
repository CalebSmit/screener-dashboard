# Pre-registered experiments for the research engine (v2_experiments.py).
#
# Every entry here was written and committed BEFORE it was run - the git history is the record.
# A prediction is never edited after a run; a changed idea is a new entry with a new id. Results
# are judged on the held-out months (2023-07 .. 2026-08), paired with the baseline by month,
# against p < 0.05 / (number of experiments) and |t| >= 3. (Corrected 2026-10-16: this said "on the
# same stocks and months". The pairing is by month only - each configuration ranks the stocks it has
# enough weighted data to score, so a narrow screen's IC is on a different, usually smaller, set;
# research/measurements/2026-10-16-stocks-ranked-per-config.json. Pairing on each month's common
# stocks is queued in plan/research-engine.md.)
#
# Disclosure fields added 2026-10-16, after the audit; no prediction, result or transform changed:
#   outcome_known_at_registration - periods whose outcome had already been computed and committed
#     before the entry was registered. The seven only-* entries: each category score's 2020-2026 IC
#     was published in research/measurements/2026-10-15-backtest-v2-returns.json (commit b6f7fd9,
#     11:31) and -rebuild2.json (710f610, 16:55) before this file's first commit (ab983cc, 17:13);
#     the ledger's first runs match those figures to about four decimals. For them only 2012-2019
#     is a blind test. v2_experiments.run refuses an undisclosed case (refuse_known_outcomes).
#   construction_note - how the screen as built here differs from the paper it cites.
#
# The universe and its limits (backtest_v2.py): the S&P 500 as it stood each month-end 2020-01 ..
# 2026-08, rebuilt from SEC filings as they were filed, the stocks that have since left the index
# missing (survivorship), and the analyst inputs absent (Revisions and forward EPS growth at weight
# 0). Every experiment shares those limits; what differs between them is only the weighting.
#
# Registered 2026-10-15 (owner-run). Prior expectations come from the Factor Lab
# (research/2026-10-12-factor-lab-findings.md, the large-company experiments 8 and 9, experiment
# 10) and the papers named; the lab found most published premia weaker after their samples and
# about half-size among large companies, so the default expectation for any single change over 80
# months is "not distinguishable".

# ---- 2012-2019: the period before the sample (registered 2026-10-15, evening)
# Written after the first batch was read on 2020-2026 and BEFORE any month of 2012-2019 was built -
# the commit that adds this block precedes the commit that adds those months to the ledger. The
# rule, fixed now: every experiment above is rerun unchanged on 2012-01 .. 2019-12 and compared with
# the baseline month by month. An experiment is CONFIRMED only if its 2012-2019 difference clears
# p < 0.05 / (experiments registered) and |t| >= 3, and in the same direction as its 2020-2026
# difference. Nothing else counts as a finding; p < 0.05 alone is reported as what chance gives
# about one time in twenty. Source for the design: Linnainmaa & Roberts (2018), RFS 31(7).
# Predictions: the baseline's 2012-2019 IC is positive but below 0.03 and not distinguishable from
# zero at |t| >= 3; no experiment is confirmed; the momentum-only screens, which were the best in
# the held-out months, are not better in 2012-2019. Known limit, larger than in 2020-2026: the
# members that have since left the index are missing (survivorship), counted month by month in
# the census.
presample:
  months: [2012-01-31, 2019-12-31]
  rule: confirmed only at p < 0.05/N and |t| >= 3, same direction as 2020-2026
  source: Linnainmaa & Roberts (2018), The History of the Cross-Section of Stock Returns, RFS 31(7)

# ---- evaluations: what a construction rule would have done (registered 2026-10-15, night, before
# its first run; plan/research-engine.md item 4). Run with `python v2_experiments.py evaluate`.
evaluations:
  - id: bot-rule-v1.1
    hypothesis: The trading bot's rule (screener-bot STRATEGY_LOG v1.1) on the baseline's rankings.
    source: screener-bot bot/strategy.py plan_rebalance and config defaults; STRATEGY_LOG.md 2026-10-09 v1.1 and 2026-10-10 (5 bps a side).
    rule: {target_count: 25, sell_rank: 40, max_per_sector: 6, cash_reserve_pct: 2, cost_bps: 5, drawdown_halt_pct: 25}
    prediction: >-
      Excess return over the equal-weighted universe not distinguishable from zero in any period
      (|t| < 2), each point estimate within +-0.3% a month; against the cap-weighted S&P 500
      total-return index, below it in 2020-2026 (the equal-weighted universe lagged it); turnover
      between 50% and 150% a year; maximum drawdown within 5 points of the universe's; the drawdown
      halt fires in at most 3 months, in 2020 if at all.
    differences: >-
      monthly, where the bot rebalances weekly; a name missing from a month's ranking is sold at
      once, where the bot waits a few runs; no order-size cap or minimum; cash earns nothing; the
      rankings are the filings-and-prices screener (no Revisions, no forward EPS growth) on v2's
      survivorship-limited universe.

experiments:
  - id: baseline
    hypothesis: The current weighting (the filings-and-prices screener, v2_config).
    source: config.yaml, with backtest_v2.v2_config removing the inputs that have no free history.
    prediction: IC near zero (the first reading, 2026-10-15, was -0.001 +- 0.027).
    transform: {kind: baseline}

  # ---- 1/N: is the weighting itself adding anything?
  - id: equal-categories
    hypothesis: Equal weight on every scored category does as well as the chosen weights.
    source: DeMiguel, Garlappi & Uppal (2009), Review of Financial Studies 22(5) - optimised weights rarely beat 1/N out of sample.
    prediction: Not distinguishable from the baseline.
    transform: {kind: equal_categories}

  # ---- each category alone: which carries the composite?
  - id: only-valuation
    hypothesis: Valuation alone ranks next month's returns.
    source: Fama & French (1992); the lab - the earnings-yield gap among large companies reversed after 2007.
    prediction: IC near zero or negative over 2020-2026; not distinguishable from the baseline.
    transform: {kind: only_category, category: valuation}
    outcome_known_at_registration: ["2020-2026"]
  - id: only-quality
    hypothesis: Quality alone ranks next month's returns.
    source: Novy-Marx (2013); Asness, Frazzini & Pedersen (2019); the lab - profitability is the factor that holds among large companies.
    prediction: The highest IC of the single categories, positive; probably not distinguishable from the baseline in 38 months.
    transform: {kind: only_category, category: quality}
    outcome_known_at_registration: ["2020-2026"]
  - id: only-growth
    hypothesis: Growth alone ranks next month's returns.
    source: research/2026-10-12-growth-category.md - no published premium for growth as measured.
    prediction: IC near zero; not distinguishable.
    transform: {kind: only_category, category: growth}
    outcome_known_at_registration: ["2020-2026"]
  - id: only-momentum
    hypothesis: Momentum alone ranks next month's returns.
    source: Jegadeesh & Titman (1993); the lab - large-company momentum about flat since 2000.
    prediction: IC near zero with the widest month-to-month spread; not distinguishable.
    transform: {kind: only_category, category: momentum}
    outcome_known_at_registration: ["2020-2026"]
  - id: only-risk
    hypothesis: The low-risk category alone ranks next month's returns.
    source: Ang, Hodrick, Xing & Zhang (2006); Baker, Bradley & Wurgler (2011); the lab - similar return, lower volatility.
    prediction: IC near zero or negative in a rising market, with the lowest volatility of the top tenth.
    transform: {kind: only_category, category: risk}
    outcome_known_at_registration: ["2020-2026"]
  - id: only-size
    hypothesis: Size alone ranks next month's returns.
    source: Fama & French (1992); the lab - between the two largest size groups the difference is small.
    prediction: IC near zero; not distinguishable.
    transform: {kind: only_category, category: size}
    outcome_known_at_registration: ["2020-2026"]
    construction_note: "Ranked within sector, as the engine ranks every metric (factor_engine.compute_sector_percentiles): the screen favours companies that are small for their sector. Fama & French (1992) sort the whole market by size."
  - id: only-investment
    hypothesis: Investment (low asset growth) alone ranks next month's returns.
    source: Cooper, Gulen & Schill (2008); Fama & French (2015); the lab - about half-size among large companies.
    prediction: IC near zero; not distinguishable.
    transform: {kind: only_category, category: investment}
    outcome_known_at_registration: ["2020-2026"]

  # ---- leave one out: does any category hurt?
  - id: drop-valuation
    hypothesis: The composite without Valuation.
    source: Leave-one-out ablation.
    prediction: Not distinguishable from the baseline.
    transform: {kind: drop_category, category: valuation}
  - id: drop-quality
    hypothesis: The composite without Quality.
    source: Leave-one-out ablation.
    prediction: Not distinguishable from the baseline; if any drop is worse, this one.
    transform: {kind: drop_category, category: quality}
  - id: drop-growth
    hypothesis: The composite without Growth.
    source: Leave-one-out ablation; research/2026-10-12-growth-category.md section 10 (Growth as the counterweight).
    prediction: Not distinguishable from the baseline.
    transform: {kind: drop_category, category: growth}
  - id: drop-momentum
    hypothesis: The composite without Momentum.
    source: Leave-one-out ablation.
    prediction: Not distinguishable from the baseline.
    transform: {kind: drop_category, category: momentum}
  - id: drop-risk
    hypothesis: The composite without Risk.
    source: Leave-one-out ablation.
    prediction: Not distinguishable from the baseline.
    transform: {kind: drop_category, category: risk}
  - id: drop-size
    hypothesis: The composite without Size.
    source: Leave-one-out ablation.
    prediction: Not distinguishable from the baseline.
    transform: {kind: drop_category, category: size}
  - id: drop-investment
    hypothesis: The composite without Investment.
    source: Leave-one-out ablation.
    prediction: Not distinguishable from the baseline.
    transform: {kind: drop_category, category: investment}

  # ---- published screens, built from the screener's own metrics
  - id: magic-formula
    hypothesis: Greenblatt's Magic Formula - cheap on operating earnings against enterprise value, high return on capital - ranks returns.
    source: Greenblatt (2006), The Little Book That Beats the Market; EBIT/EV approximated by EV/EBITDA, return on capital by ROIC.
    prediction: IC slightly positive; not distinguishable from the baseline.
    transform:
      kind: metrics
      metrics: {valuation: {ev_ebitda: 50}, quality: {roic: 50}}
  - id: piotroski-only
    hypothesis: Piotroski's F-score alone ranks returns among large companies.
    source: Piotroski (2000), Journal of Accounting Research 38 - the effect was concentrated in small, high book-to-market stocks.
    prediction: IC near zero; not distinguishable.
    transform:
      kind: metrics
      metrics: {quality: {piotroski_f_score: 100}}
    construction_note: "Ranked within sector, as the engine ranks every metric (factor_engine.compute_sector_percentiles): the F-score is compared with sector peers. Piotroski (2000) applies it across the market, among high book-to-market firms."
  - id: profitability-and-value
    hypothesis: Gross profitability with value ranks better than either alone.
    source: Novy-Marx (2013), JFE 108 - profitability and value are negatively correlated, so together they hedge; the lab's experiment 10.
    prediction: IC positive and above only-quality and only-valuation; not distinguishable from the baseline.
    transform:
      kind: metrics
      metrics: {valuation: {earnings_yield: 50}, quality: {gross_profit_assets: 50}}
    construction_note: "Ranked within sector, as the engine ranks every metric (factor_engine.compute_sector_percentiles). The value half is earnings yield, where Novy-Marx (2013) uses book-to-market; his hedge comes from profitability's negative correlation with book-to-market. Here earnings yield and gross profit to assets have an average monthly within-sector rank correlation of +0.045 over 176 months (research/measurements/2026-10-16-stocks-ranked-per-config.json), so the screen does not carry that hedge."
  - id: fcf-yield-only
    hypothesis: Free-cash-flow yield, the screener's heaviest single metric, alone ranks returns.
    source: Valuation's own construction (45% of Valuation); the lab's queued cash-flow-yield sort.
    prediction: IC near zero; not distinguishable.
    transform:
      kind: metrics
      metrics: {valuation: {fcf_yield: 100}}
    construction_note: "Ranked within sector, as the engine ranks every metric (factor_engine.compute_sector_percentiles): free-cash-flow yield against sector peers, which is how the screener's Valuation category uses it."
  - id: momentum-12-1-only
    hypothesis: The classic 12-1 month return alone ranks returns.
    source: Jegadeesh & Titman (1993); Asness, Moskowitz & Pedersen (2013).
    prediction: IC near zero; not distinguishable.
    transform:
      kind: metrics
      metrics: {momentum: {return_12_1: 100}}
    construction_note: "Ranked within sector, as the engine ranks every metric (factor_engine.compute_sector_percentiles): a stock's 12-1 month return against its sector peers, which removes the industry component of momentum (Moskowitz & Grinblatt 1999). Jegadeesh & Titman (1993) rank across the whole market."
  - id: low-volatility-only
    hypothesis: Low volatility alone ranks returns.
    source: Ang et al. (2006); Frazzini & Pedersen (2014).
    prediction: IC near zero or negative; the lowest top-tenth volatility of all.
    transform:
      kind: metrics
      metrics: {risk: {volatility: 100}}
    construction_note: "Ranked within sector, as the engine ranks every metric (factor_engine.compute_sector_percentiles): volatility against sector peers. Ang et al. (2006) and Frazzini & Pedersen (2014) sort across the whole market."

  # ---- construction choices the screener already has switches for
  - id: orthogonalised-categories
    hypothesis: Removing the overlap between categories before combining them (Gram-Schmidt, the built-in switch) improves the ranking.
    source: config.yaml factor_neutralization (built, switched off); the overlap of value and investment measured in the lab.
    prediction: Not distinguishable from the baseline.
    transform:
      kind: config
      set: {factor_neutralization.enabled: true, factor_neutralization.method: gram_schmidt}
  - id: sector-relative-composite
    hypothesis: Normalising the composite within each sector (the built-in switch) improves the ranking.
    source: config.yaml sector_neutral.sector_relative_composite.
    prediction: Not distinguishable from the baseline.
    transform:
      kind: config
      set: {sector_neutral.sector_relative_composite: true}
    # added after the run, prediction unchanged: the run compared identical rankings in all 80 months
    void: the switch changes only the display column Composite_Pct, never the ranking (factor_engine, since Phase 13) - the experiment tested nothing
  - id: whole-market-percentiles
    hypothesis: Ranking each metric across the whole market instead of within its sector does as well.
    source: Asness, Porter & Stevens (2000), "Predicting stock returns using industry-relative firm characteristics" - industry-relative measures predicted better.
    prediction: No better than the baseline, possibly worse.
    transform: {kind: whole_market}

  # ---- batch 2, registered 2026-10-15 evening, before any run of them and before any 2012-2019
  # month was scored; judged by the same rules on both periods
  - id: value-and-momentum
    hypothesis: Earnings yield and the 12-1 month return together rank better than either alone, because the two are negatively correlated.
    source: Asness, Moskowitz & Pedersen (2013), Value and Momentum Everywhere, Journal of Finance 68(3).
    prediction: IC positive in both periods; not distinguishable from the baseline at the multiple-testing bar.
    transform:
      kind: metrics
      metrics: {valuation: {earnings_yield: 50}, momentum: {return_12_1: 50}}
  - id: 52-week-high
    hypothesis: Nearness to the 52-week high ranks returns (the anchoring explanation of momentum).
    source: George & Hwang (2004), The 52-Week High and Momentum Investing, Journal of Finance 59(5).
    prediction: Not distinguishable from the baseline.
    transform:
      kind: metrics
      metrics: {momentum: {proximity_52w_high: 100}}
    construction_note: "Ranked within sector, as the engine ranks every metric (factor_engine.compute_sector_percentiles): nearness to the 52-week high against sector peers. George & Hwang (2004) rank across the whole market."
  - id: profitability-and-low-volatility
    hypothesis: Return on capital with low volatility - the defensive screen - ranks returns with a calmer top tenth.
    source: Novy-Marx (2016), Understanding Defensive Equity, NBER w20591 - defensive returns are largely profitability and size; Frazzini & Pedersen (2014).
    prediction: Not distinguishable from the baseline; among the lowest top-tenth volatility of the multi-metric screens.
    transform:
      kind: metrics
      metrics: {quality: {roic: 50}, risk: {volatility: 50}}
